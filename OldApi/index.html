<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Word Graph</title>
</head>
<body>
  <h1>Word Graph</h1>

  <input type="text" id="wordInput" placeholder="Enter a word" />
  <button onclick="loadGraph()">Generate Graph</button>

  <p id="status"></p>

  <iframe id="graphFrame" width="100%" height="850px" style="border:none; margin-top:10px;"></iframe>

  <script>
    async function loadGraph() {
      const word = document.getElementById("wordInput").value.trim();
      if (!word) {
        alert("Please enter a word.");
        return;
      }
      document.getElementById("status").textContent = "Loading...";
      const url = `http://localhost:5000/graph?word=${encodeURIComponent(word)}`;
      try {
        const res = await fetch(url);
        if (!res.ok) {
          const err = await res.json();
          document.getElementById("status").textContent = "Error: " + err.error;
          return;
        }
        const html = await res.text();
        const iframe = document.getElementById("graphFrame");
        iframe.srcdoc = html;
        document.getElementById("status").textContent = `Graph loaded for "${word}"`;
      } catch (e) {
        document.getElementById("status").textContent = "Could not connect to Flask server. Is it running?";
      }
    }
  </script>
</body>
</html>
